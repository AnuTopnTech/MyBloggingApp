@if(blog){
<div class="flex flex-col px-40 mt-10">
  <div class="flex items-baseline gap-4">
    <h1 class="text-4xl font-bold">{{blog.title}}</h1>
    <span class="bg-orange-400 text-white font-bold rounded-md shadow-md p-2">{{getCategoryName()}}</span>
  </div>

  @if(blog.image){
  <div class="h-96 mb-10">
    <img class="w-full h-full" [src]="blog.image" alt="picture" />
  </div>
    }

  <div [innerHTML]="blog.content"></div>
</div>
}@else{
<p>Loading...</p>
}
