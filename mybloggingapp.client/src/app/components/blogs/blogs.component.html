<div class="flex flex-col items-center px-20 mb-10">
  <h1>All Blogs</h1>
  <div class="flex flex-wrap gap-4">
    @for(blog of allBlog;track $index){
    <div class="w-3/12">

      <mat-card class="example-card" appearance="outlined">
        <mat-card-header>
          <div mat-card-avatar class="example-header-image"></div>
          <mat-card-title>{{blog.title}}</mat-card-title>
        </mat-card-header>
        <img mat-card-image [src]="blog.image" alt="Photo of a Shiba Inu">
        <mat-card-content>
          <p>
            {{blog.description}}
          </p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary" [routerLink]="'/blog/'+blog.id">Read more..</button>
        </mat-card-actions>
      </mat-card>
    </div>
    }

  </div>
</div>
